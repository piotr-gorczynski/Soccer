name: Check Translation Completeness

on:
  pull_request:
    paths:
      - 'mobile/app/src/main/res/values*/**'
      - 'firebase/seed/**'
      - 'tools/check-translation-completeness.py'
      - '.github/workflows/check-translations.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/app/src/main/res/values*/**'
      - 'firebase/seed/**'
      - 'tools/check-translation-completeness.py'
  workflow_dispatch:

jobs:
  check-translations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Check translation completeness
        run: python3 tools/check-translation-completeness.py
