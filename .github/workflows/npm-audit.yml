name: npm-audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - .
          - tools/create-tournament
          - firebase/functions/accept-invite
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Show versions + files
        working-directory: ${{ matrix.dir }}
        run: |
          node -v
          npm -v
          pwd
          ls -la
          test -f package.json && cat package.json | head -n 80
          test -f package-lock.json && cat package-lock.json | head -n 60

      - name: Install deps (clean)
        working-directory: ${{ matrix.dir }}
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Debug installed versions
        working-directory: ${{ matrix.dir }}
        run: |
          npm ls fast-xml-parser lodash || true

      - name: npm audit (fail on high+)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high
