# deploy_firebase_analytics.yaml
substitutions:
  _ENVIRONMENT: 'dev'
  _FOLDER_NAME: 'soccer'
  _ANALYTICS_ACCOUNT_ID: ''

steps:
# 0. Resolve Firebase project ID & number
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'get-project-info'
  entrypoint: bash
  args:
    - '-c'
    - |
      set -ex
      # project ID
      gcloud projects list \
        --filter="name~^${_FOLDER_NAME}-${_ENVIRONMENT}" \
        --format="value(projectId)" | head -n1 \
        > /workspace/firebase_project_id.txt
      test -s /workspace/firebase_project_id.txt

      # project number
      project_id=$(< /workspace/firebase_project_id.txt)
      gcloud projects describe "$project_id" \
        --format="value(projectNumber)" \
        > /workspace/firebase_project_number.txt
      test -s /workspace/firebase_project_number.txt

      echo "✅ Found Firebase project: $project_id"

# 1. Enable required APIs for Firebase Analytics
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'enable-analytics-apis'
  entrypoint: bash
  args:
    - '-c'
    - |
      set -ex
      project=$(< /workspace/firebase_project_id.txt)

      enable_api() {
        local api_name=$1
        echo "🔓 Enabling API: $api_name for project $project..."
        result=$(gcloud services enable "$api_name" --project="$project" 2>&1)
        echo "$result"
        status=$?

        if [ $status -eq 0 ]; then
          echo "✅ $api_name enabled successfully."
        elif echo "$result" | grep -qi "already enabled"; then
          echo "ℹ️ $api_name was already enabled."
        else
          echo "❌ Failed to enable $api_name. Exiting."
          exit 1
        fi
      }

      # Enable Firebase API required for Analytics
      enable_api "firebase.googleapis.com"

      echo "🎉 Firebase API for Analytics enabled."

# 2. Generate access token for Firebase Management API calls
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'generate-access-token'
  entrypoint: bash
  args:
    - '-c'
    - |
      set -ex
      access_token=$(gcloud auth print-access-token)
      echo "$access_token" > /workspace/access_token.txt
      echo "🔑 Access token generated and stored."

# 3. Check if Firebase Analytics is already enabled
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'check-analytics-status'
  entrypoint: bash
  args:
    - '-c'
    - |
      set -euo pipefail
      project=$(< /workspace/firebase_project_id.txt)
      access_token=$(< /workspace/access_token.txt)

      echo "🔍 Checking Firebase Analytics status for project: $project..."

      # Check if Firebase project exists and has Analytics enabled
      response=$(curl -s -w '\n%{http_code}' -X GET \
        -H "Authorization: Bearer $access_token" \
        -H "Content-Type: application/json" \
        "https://firebase.googleapis.com/v1beta1/projects/$project")

      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | head -n-1)

      if [[ "$http_code" == "200" ]]; then
        echo "✅ Firebase project found."
        
        # Check if Analytics is mentioned in the response
        if echo "$body" | grep -q "analyticsIntegrationStatus"; then
          analytics_status=$(echo "$body" | grep -o '"analyticsIntegrationStatus":\s*"[^"]*"' | cut -d'"' -f4)
          echo "📊 Analytics integration status: $analytics_status"
          
          if [[ "$analytics_status" == "ENABLED" ]]; then
            echo "✅ Firebase Analytics is already enabled. Skipping enablement."
            echo "enabled" > /workspace/analytics_status.txt
            exit 0
          fi
        fi
        
        echo "📊 Firebase Analytics is not enabled or status unclear."
        echo "disabled" > /workspace/analytics_status.txt
      else
        echo "❌ Failed to get Firebase project info (HTTP $http_code):"
        echo "$body"
        echo "disabled" > /workspace/analytics_status.txt
      fi
# 4) Ensure GA Editor for the CI principal (optional; soft-skip if no GA admin SA provided)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'grant-ga-editor-to-cloudbuild'
  entrypoint: bash
  args:
    - -c
    - |
      set -euo pipefail

      project_id="$(< /workspace/firebase_project_id.txt)"
      project_num="$(< /workspace/firebase_project_number.txt)"
      # Who to grant GA Editor to:
      grant_to="${_GA_GRANT_TO:-${project_num}@cloudbuild.gserviceaccount.com}"

      ga_account_id="${_ANALYTICS_ACCOUNT_ID:-}"
      ga_property_id="${_ANALYTICS_PROPERTY_ID:-}"
      ga_admin_sa="${_GA_ADMIN_IMPERSONATE_SA:-}"

      if [ -z "$ga_admin_sa" ]; then
        echo "ℹ️ _GA_ADMIN_IMPERSONATE_SA not set; skipping GA role grant."
        echo "   (Make sure $grant_to is an Editor on the GA account/property.)"
        exit 0
      fi

      echo "🔧 Enabling Analytics Admin API (idempotent)…"
      gcloud services enable analyticsadmin.googleapis.com --project="$project_id" >/dev/null

      echo "🔑 Getting GA Admin API token by impersonating $ga_admin_sa (with analytics.edit scope)…"
      access_token="$(gcloud auth application-default print-access-token \
        --impersonate-service-account="$ga_admin_sa" \
        --scopes=https://www.googleapis.com/auth/analytics.edit,https://www.googleapis.com/auth/analytics.readonly)"

      # Resolve GA Account if only property provided
      if [ -z "$ga_account_id" ] && [ -n "$ga_property_id" ]; then
        echo "🔎 Resolving GA account from property $ga_property_id…"
        prop_resp="$(curl -sS -w '\n%{http_code}' \
          -H "Authorization: Bearer $access_token" \
          "https://analyticsadmin.googleapis.com/v1beta/properties/$ga_property_id")"
        prop_code="$(echo "$prop_resp" | tail -n1)"
        prop_body="$(echo "$prop_resp" | head -n-1)"
        if [ "$prop_code" != "200" ]; then
          echo "❌ Cannot look up GA account for property $ga_property_id (HTTP $prop_code):"
          echo "$prop_body"
          exit 1
        fi
        account_path="$(echo "$prop_body" | sed -n 's/.*"account"[[:space:]]*:[[:space:]]*"\(accounts\/[0-9]\+\)".*/\1/p')"
        ga_account_id="${account_path##accounts/}"
      fi

      if [ -z "$ga_account_id" ]; then
        echo "❌ Provide _ANALYTICS_ACCOUNT_ID or _ANALYTICS_PROPERTY_ID so I can identify the GA account."
        exit 1
      fi

      echo "🔐 Ensuring GA account $ga_account_id grants Editor to $grant_to…"
      list_resp="$(curl -sS -w '\n%{http_code}' \
        -H "Authorization: Bearer $access_token" \
        "https://analyticsadmin.googleapis.com/v1beta/accounts/$ga_account_id/userLinks?pageSize=2000")"
      list_code="$(echo "$list_resp" | tail -n1)"
      list_body="$(echo "$list_resp" | head -n-1)"
      if [ "$list_code" != "200" ]; then
        echo "❌ Unable to list userLinks (HTTP $list_code):"
        echo "$list_body"
        exit 1
      fi

      if echo "$list_body" | grep -q "\"emailAddress\": *\"$grant_to\""; then
        echo "ℹ️ $grant_to already has GA access. Nothing to do."
        exit 0
      fi

      echo "➕ Granting Editor to $grant_to on GA account $ga_account_id…"
      payload="$(cat <<JSON
      {"notifyNewUser": false, "userLink": { "emailAddress": "$grant_to", "directRoles": ["roles/editor"] }}
      JSON
      )"
      create_resp="$(curl -sS -w '\n%{http_code}' -X POST \
        -H "Authorization: Bearer $access_token" \
        -H "Content-Type: application/json" \
        "https://analyticsadmin.googleapis.com/v1beta/accounts/$ga_account_id/userLinks" \
        -d "$payload")"
      create_code="$(echo "$create_resp" | tail -n1)"
      create_body="$(echo "$create_resp" | head -n-1)"

      case "$create_code" in
        200|201) echo "✅ Granted Editor to $grant_to." ;;
        409)     echo "ℹ️ User link already exists (409). Continuing." ;;
        403)
          echo "❌ Permission denied creating user link (need GA Administrator on account $ga_account_id)."
          echo "$create_body"
          exit 1
          ;;
        *) echo "❌ Failed (HTTP $create_code):"; echo "$create_body"; exit 1 ;;
      esac

# 5) Enable / link Google Analytics (uses property if provided; else account)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'enable-analytics'
  entrypoint: bash
  args:
    - -c
    - |
      set -euo pipefail
      project="$(< /workspace/firebase_project_id.txt)"
      access_token="$(< /workspace/access_token.txt)"
      status_file="/workspace/analytics_status.txt"

      echo "🔎 Checking current Analytics link status for '$project'…"
      get_resp="$(curl -sS -w '\n%{http_code}' \
        -H "Authorization: Bearer $access_token" \
        "https://firebase.googleapis.com/v1beta1/projects/$project/analyticsDetails")"
      get_code="$(echo "$get_resp" | tail -n1)"
      if [ "$get_code" = "200" ]; then
        echo "✅ Analytics already enabled."
        echo "enabled" > "$status_file"; exit 0
      fi

      echo "🚀 Linking Google Analytics…"
      analytics_account_id="${_ANALYTICS_ACCOUNT_ID:-}"
      analytics_property_id="${_ANALYTICS_PROPERTY_ID:-}"

      if [ -n "$analytics_property_id" ]; then
        data="{\"analyticsPropertyId\":\"$analytics_property_id\"}"
        echo "ℹ️ Will link to existing GA4 property ID: $analytics_property_id"
      elif [ -n "$analytics_account_id" ]; then
        data="{\"analyticsAccountId\":\"$analytics_account_id\"}"
        echo "ℹ️ Will create a new GA4 property under GA Account ID: $analytics_account_id"
      else
        echo "ℹ️ No _ANALYTICS_PROPERTY_ID or _ANALYTICS_ACCOUNT_ID provided; skipping."
        exit 0
      fi

      post_resp="$(curl -sS -w '\n%{http_code}' -X POST \
        -H "Authorization: Bearer $access_token" \
        -H "Content-Type: application/json" \
        "https://firebase.googleapis.com/v1beta1/projects/$project:addGoogleAnalytics" \
        -d "$data")"
      post_code="$(echo "$post_resp" | tail -n1)"
      post_body="$(echo "$post_resp" | head -n-1)"

      case "$post_code" in
        200) echo "✅ addGoogleAnalytics accepted. Waiting for operation to finish…" ;;
        400|409)
          if echo "$post_body" | grep -qi "already linked\|already enabled"; then
            echo "ℹ️ Analytics already linked. Continuing."
            echo "enabled" > "$status_file"; exit 0
          else
            echo "❌ API error $post_code:"; echo "$post_body"; exit 1
          fi ;;
        403)
          echo "❌ Permission denied (need GA Editor on the target account/property)."
          echo "$post_body"; exit 1 ;;
        *) echo "❌ Failed (HTTP $post_code):"; echo "$post_body"; exit 1 ;;
      esac

      # Poll the LRO
      op_name="$(echo "$post_body" | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]\+\)".*/\1/p' | head -n1)"
      attempts=36; sleep_secs=5; i=0
      while [ $i -lt $attempts ]; do
        i=$((i+1))
        [ -n "$op_name" ] || break
        op_resp="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $access_token" \
          "https://firebase.googleapis.com/v1beta1/$op_name")"
        op_code="$(echo "$op_resp" | tail -n1)"
        op_body="$(echo "$op_resp" | head -n-1)"
        if [ "$op_code" = "200" ] && echo "$op_body" | grep -q '"done": *true'; then
          if echo "$op_body" | grep -q '"error"'; then
            echo "❌ Operation finished with error:"; echo "$op_body"; exit 1
          fi
          echo "✅ Operation finished."; break
        fi
        sleep "$sleep_secs"
      done

      # Final verification
      final_code="$(curl -sS -o /dev/null -w '%{http_code}' \
        -H "Authorization: Bearer $access_token" \
        "https://firebase.googleapis.com/v1beta1/projects/$project/analyticsDetails")"
      if [ "$final_code" = "200" ]; then
        echo "🎉 Analytics is now enabled."; echo "enabled" > "$status_file"; exit 0
      fi
      echo "⚠️ Could not confirm Analytics enablement (HTTP $final_code). Continuing."; exit 0

# 6) Verify Analytics enablement
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'verify-analytics'
  entrypoint: bash
  args:
    - -c
    - |
      set -euo pipefail
      project="$(< /workspace/firebase_project_id.txt)"
      access_token="$(< /workspace/access_token.txt)"

      echo "🔍 Verifying Firebase Analytics link for '$project'…"
      sleep 10
      resp="$(curl -sS -w '\n%{http_code}' \
        -H "Authorization: Bearer $access_token" \
        "https://firebase.googleapis.com/v1beta1/projects/$project/analyticsDetails")"
      code="$(echo "$resp" | tail -n1)"
      body="$(echo "$resp" | head -n-1)"

      if [ "$code" = "200" ]; then
        echo "✅ Analytics is linked."
        prop_id="$(echo "$body" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([0-9]\+\)".*/\1/p' | head -n1)"
        acct_id="$(echo "$body" | sed -n 's/.*"analyticsAccountId"[[:space:]]*:[[:space:]]*"\([0-9]\+\)".*/\1/p' | head -n1)"
        [ -n "$prop_id" ] && echo "   • Property ID: $prop_id"
        [ -n "$acct_id" ] && echo "   • Account  ID: $acct_id"
        echo "enabled" > /workspace/analytics_status.txt
      elif [ "$code" = "404" ]; then
        echo "ℹ️ Analytics not linked yet (HTTP 404)."
        echo "disabled" > /workspace/analytics_status.txt
      else
        echo "⚠️ Could not verify Analytics (HTTP $code):"
        echo "$body"
      fi

options:
  logging: CLOUD_LOGGING_ONLY