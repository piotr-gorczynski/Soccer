substitutions:
  _ENVIRONMENT: 'dev'
  _FOLDER_NAME: 'soccer'
  _PRIVATE_REPO: 'git@github.com:piotr-gorczynski/Soccer-private.git'
  _BRANCH_NAME: 'main'
  _TARGET_PATH: 'google-services.${_ENVIRONMENT}.json'  # Save env-specific config

availableSecrets:
  secretManager:
    - versionName: projects/org-service-account-001/secrets/github_ssh_key_soccer_private/versions/latest
      env: 'ssh_private_key'

steps:
  # Step 1: Get Firebase project ID
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'get-firebase-project-id'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        gcloud projects list \
          --filter="name~^${_FOLDER_NAME}-${_ENVIRONMENT}" \
          --format="value(projectId)" | head -n 1 > /workspace/SOCCER_PROJECT_ID.txt

  # Step 2: Install Firebase CLI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'install-firebase-cli'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        curl -sL https://firebase.tools | bash
        mkdir -p /workspace/firebase
        cp /usr/local/bin/firebase /workspace/firebase/
        chmod +x /workspace/firebase/firebase

  # Step 3: Download configs for ALL Android apps and merge into a single google-services.json
  # A single google-services.json contains client entries for every registered Android app
  # (e.g. piotr_gorczynski.soccer2 and piotr_gorczynski.soccer2.bd) so the Firebase
  # Google-Services Gradle plugin can resolve the correct config for each product flavor.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        project_id=$(cat /workspace/SOCCER_PROJECT_ID.txt)
        firebase_output=$(/workspace/firebase/firebase apps:list --project="$project_id")
        echo "$firebase_output" > /workspace/apps_list.txt

        echo "🔍 Firebase apps output:"
        cat /workspace/apps_list.txt

        # Collect ALL Android app IDs (not just the first one)
        app_ids=$(grep ANDROID /workspace/apps_list.txt | grep -v "App ID" | awk -F '│' '{print $3}' | tr -d ' ')

        if [ -z "$app_ids" ]; then
          echo "❌ No Firebase Android app IDs found."
          exit 1
        fi

        echo "📥 Downloading google-services configs for all Android apps..."
        mkdir -p /workspace/app_configs
        index=0
        while IFS= read -r app_id; do
          if [ -z "$app_id" ]; then
            continue
          fi
          echo "📥 Downloading config for app ID: $app_id"
          /workspace/firebase/firebase apps:sdkconfig android "$app_id" \
            --project="$project_id" \
            > /workspace/app_configs/config_${index}.json
          index=$((index + 1))
        done <<< "$app_ids"

        if [ "$index" -eq 0 ]; then
          echo "❌ No configs were downloaded."
          exit 1
        fi

        echo "🔀 Merging ${index} config(s) into single google-services.json..."
        python3 - <<'PY'
        import json
        import sys
        from pathlib import Path

        config_dir = Path("/workspace/app_configs")
        config_files = sorted(config_dir.glob("config_*.json"))

        if not config_files:
            print("❌ No config files found to merge", file=sys.stderr)
            sys.exit(1)

        with open(config_files[0]) as f:
            merged = json.load(f)

        if "client" not in merged:
            merged["client"] = []

        for config_file in config_files[1:]:
            with open(config_file) as f:
                config = json.load(f)
            merged["client"].extend(config.get("client", []))

        with open("/workspace/google-services.json", "w") as f:
            json.dump(merged, f, indent=2)

        print(f"✅ Merged {len(config_files)} app config(s) into google-services.json")
        print(f"   Total clients: {len(merged.get('client', []))}")
        for client in merged.get("client", []):
            pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name", "unknown")
            print(f"   - Package: {pkg}")
        PY

  # Step 4: Clone private repo
  - name: 'gcr.io/cloud-builders/git'
    id: 'clone-repo'
    secretEnv: ['ssh_private_key']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        mkdir -p /root/.ssh
        echo "$ssh_private_key" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan github.com >> /root/.ssh/known_hosts

        git config --global user.email "ci-bot@soccer.dev"
        git config --global user.name "CI Bot"

        git clone ${_PRIVATE_REPO} /workspace/private-repo
        cp /workspace/google-services.json /workspace/private-repo/${_TARGET_PATH}

  # Step 5: Commit and push changes
  - name: 'gcr.io/cloud-builders/git'
    id: 'commit-and-push'
    dir: '/workspace/private-repo'
    secretEnv: ['ssh_private_key']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        # Re-establish SSH for this container
        mkdir -p /root/.ssh
        echo "$ssh_private_key" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan github.com >> /root/.ssh/known_hosts

        git add ${_TARGET_PATH}
        if git diff-index --quiet HEAD -- ${_TARGET_PATH}; then
          echo "No changes to commit"
        else
          git commit -m "🔄 Update google-services.json from Firebase [CI]"
          git push origin ${_BRANCH_NAME}
        fi

options:
  logging: CLOUD_LOGGING_ONLY
