substitutions:
  _ENVIRONMENT: 'dev'
  _FOLDER_NAME: 'soccer'
  _PRIVATE_REPO: 'git@github.com:piotr-gorczynski/Soccer-private.git'
  _BRANCH_NAME: 'main'

availableSecrets:
  secretManager:
    - versionName: projects/org-service-account-001/secrets/github_ssh_key_soccer_private/versions/latest
      env: 'ssh_private_key'

steps:
  # Step 1: Get Firebase project ID
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'get-firebase-project-id'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        gcloud projects list \
          --filter="name~^${_FOLDER_NAME}-${_ENVIRONMENT}" \
          --format="value(projectId)" | head -n 1 > /workspace/SOCCER_PROJECT_ID.txt

  # Step 2: Install Firebase CLI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'install-firebase-cli'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        curl -sL https://firebase.tools | bash
        mkdir -p /workspace/firebase
        cp /usr/local/bin/firebase /workspace/firebase/
        chmod +x /workspace/firebase/firebase

  # Step 3: Download google-services.json config
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        project_id=$(cat /workspace/SOCCER_PROJECT_ID.txt)
        
        echo "📱 Downloading google-services.json for project $project_id..."
        
        # Download the google-services.json file
        # Note: A single google-services.json contains configurations for all registered Android apps
        # (both piotr_gorczynski.soccer2 and piotr_gorczynski.soccer2.bd)
        /workspace/firebase/firebase apps:sdkconfig android \
          --project="$project_id" \
          > "/workspace/google-services.${_ENVIRONMENT}.json"
        
        echo "✅ Downloaded google-services.${_ENVIRONMENT}.json"
        echo "   This file contains configurations for all registered Android apps in the project."

  # Step 4: Clone private repo and copy downloaded file
  - name: 'gcr.io/cloud-builders/git'
    id: 'clone-repo'
    secretEnv: ['ssh_private_key']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        mkdir -p /root/.ssh
        echo "$ssh_private_key" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan github.com >> /root/.ssh/known_hosts

        git config --global user.email "ci-bot@soccer.dev"
        git config --global user.name "CI Bot"

        git clone ${_PRIVATE_REPO} /workspace/private-repo
        
        # Copy the downloaded google-services.json file
        echo "📁 Copying google-services.json to private repo..."
        cp "/workspace/google-services.${_ENVIRONMENT}.json" "/workspace/private-repo/google-services.${_ENVIRONMENT}.json"
        
        echo "✅ File copied to private repo."

  # Step 5: Commit and push changes
  - name: 'gcr.io/cloud-builders/git'
    id: 'commit-and-push'
    dir: '/workspace/private-repo'
    secretEnv: ['ssh_private_key']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        # Re-establish SSH for this container
        mkdir -p /root/.ssh
        echo "$ssh_private_key" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan github.com >> /root/.ssh/known_hosts

        # Add the google-services file for this environment
        git add google-services.${_ENVIRONMENT}.json || true
        
        if git diff-index --quiet HEAD -- .; then
          echo "No changes to commit"
        else
          git commit -m "🔄 Update google-services.json from Firebase [CI]"
          git push origin ${_BRANCH_NAME}
        fi

options:
  logging: CLOUD_LOGGING_ONLY
