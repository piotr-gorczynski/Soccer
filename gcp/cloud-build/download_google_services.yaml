substitutions:
  _ENVIRONMENT: 'dev'
  _FOLDER_NAME: 'soccer'
  _PRIVATE_REPO: 'git@github.com:piotr-gorczynski/Soccer-private.git'
  _BRANCH_NAME: 'main'

availableSecrets:
  secretManager:
    - versionName: projects/org-service-account-001/secrets/github_ssh_key_soccer_private/versions/latest
      env: 'ssh_private_key'

steps:
  # Step 1: Get Firebase project ID
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'get-firebase-project-id'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        gcloud projects list \
          --filter="name~^${_FOLDER_NAME}-${_ENVIRONMENT}" \
          --format="value(projectId)" | head -n 1 > /workspace/SOCCER_PROJECT_ID.txt

  # Step 2: Install Firebase CLI
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'install-firebase-cli'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        curl -sL https://firebase.tools | bash
        mkdir -p /workspace/firebase
        cp /usr/local/bin/firebase /workspace/firebase/
        chmod +x /workspace/firebase/firebase

  # Step 3: Download configs for all Android apps (Global and Bangladesh)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        project_id=$(cat /workspace/SOCCER_PROJECT_ID.txt)
        
        # Define package names for global and Bangladesh variants
        declare -A package_names
        package_names["piotr_gorczynski.soccer2"]="google-services.${_ENVIRONMENT}.json"
        package_names["piotr_gorczynski.soccer2.bd"]="google-services.${_ENVIRONMENT}.bd.json"
        
        echo "📱 Downloading google-services.json files for all apps in project $project_id..."
        
        # List all Firebase apps in JSON format to get app IDs and package names
        echo "🔍 Fetching list of existing Firebase Android apps..."
        app_list_json=$(/workspace/firebase/firebase apps:list ANDROID --project="$project_id" --json 2>/dev/null || echo "[]")
        
        echo "🔍 Raw Firebase Apps JSON Output:"
        echo "$app_list_json"
        
        # Iterate over package names and download configs
        for package_name in "${!package_names[@]}"; do
          target_file="${package_names[$package_name]}"
          echo "---"
          echo "🔍 Processing package: $package_name"
          echo "📁 Target file: $target_file"
          
          # Extract app ID for this package name using jq or grep
          if command -v jq >/dev/null 2>&1; then
            app_id=$(echo "$app_list_json" | jq -r ".[] | select(.packageName == \"$package_name\") | .appId" 2>/dev/null || true)
            echo "🔧 Used jq for JSON parsing"
          else
            # Fallback to grep-based extraction if jq is not available
            app_id=$(echo "$app_list_json" | grep -B2 "\"packageName\"[[:space:]]*:[[:space:]]*\"$package_name\"" | grep -oE '"appId"[[:space:]]*:[[:space:]]*"[^"]*"' | grep -oE '"[^"]*"$' | tr -d '"' || true)
            echo "🔧 Used grep for JSON parsing (jq not available)"
          fi
          
          if [ -z "$app_id" ]; then
            echo "⚠️ Firebase Android app ID not found for package: $package_name"
            echo "⚠️ Skipping download for this package."
            continue
          fi
          
          echo "📥 Downloading google-services.json for app ID: $app_id (package: $package_name)"
          /workspace/firebase/firebase apps:sdkconfig android "$app_id" \
            --project="$project_id" \
            > "/workspace/$target_file"
          
          echo "✅ Downloaded: $target_file"
        done
        
        echo "---"
        echo "✅ All google-services.json files downloaded."

  # Step 4: Clone private repo and copy all downloaded files
  - name: 'gcr.io/cloud-builders/git'
    id: 'clone-repo'
    secretEnv: ['ssh_private_key']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        mkdir -p /root/.ssh
        echo "$ssh_private_key" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan github.com >> /root/.ssh/known_hosts

        git config --global user.email "ci-bot@soccer.dev"
        git config --global user.name "CI Bot"

        git clone ${_PRIVATE_REPO} /workspace/private-repo
        
        # Copy all downloaded google-services.json files
        echo "📁 Copying google-services.json files to private repo..."
        cp /workspace/google-services.${_ENVIRONMENT}.json /workspace/private-repo/google-services.${_ENVIRONMENT}.json || echo "⚠️ Global config not found, skipping"
        cp /workspace/google-services.${_ENVIRONMENT}.bd.json /workspace/private-repo/google-services.${_ENVIRONMENT}.bd.json || echo "⚠️ Bangladesh config not found, skipping"
        
        echo "✅ Files copied to private repo."

  # Step 5: Commit and push changes
  - name: 'gcr.io/cloud-builders/git'
    id: 'commit-and-push'
    dir: '/workspace/private-repo'
    secretEnv: ['ssh_private_key']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        set -x
        # Re-establish SSH for this container
        mkdir -p /root/.ssh
        echo "$ssh_private_key" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan github.com >> /root/.ssh/known_hosts

        # Add all google-services files for this environment
        git add google-services.${_ENVIRONMENT}.json || true
        git add google-services.${_ENVIRONMENT}.bd.json || true
        
        if git diff-index --quiet HEAD -- .; then
          echo "No changes to commit"
        else
          git commit -m "🔄 Update google-services.json files from Firebase [CI]"
          git push origin ${_BRANCH_NAME}
        fi

options:
  logging: CLOUD_LOGGING_ONLY
