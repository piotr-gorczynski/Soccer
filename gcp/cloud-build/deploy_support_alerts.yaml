# Manual Cloud Build configuration, run in org-service-account-001 from dev.
# DEV only for the initial rollout. Does not deploy functions or modify IAM.
substitutions:
  _ENVIRONMENT: 'dev'

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'configure-dev-support-alerts'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        test '${_ENVIRONMENT}' = 'dev'
        test '$BRANCH_NAME' = 'dev'
        python3 gcp/monitoring/configure_support_alerts.py --environment '${_ENVIRONMENT}'

options:
  logging: CLOUD_LOGGING_ONLY
