// Register custom copy task
tasks.register("copyGoogleServicesJson") {
    doLast {
        def env = project.findProperty("env") ?: buildEnv
        if (env == null || env.toString().trim().isEmpty()) {
            throw new GradleException("❌ Missing environment. Use variant or -Penv=dev|test|prod")
        }
        def source = file("../../secrets/google-services.${env}.json")
        def destination = file("google-services.json")
        if (source.exists()) {
            Files.copy(source.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println("✅ google-services.json for ${env} copied to app/")
        } else {
            throw new GradleException("❌ google-services.json for env '${env}' not found in secrets/")
        }
    }
}

// Copy the backend secret key from the secrets repository into assets
tasks.register("copySoccerSecretKey") {
    doLast {
        def source = file("../../secrets/soccer_secret_key")
        def assetsDir = file("src/main/assets")
        def destination = new File(assetsDir, "soccer_secret_key")

        if (source.exists()) {
            if (!assetsDir.exists()) {
                assetsDir.mkdirs()
            }
            Files.copy(source.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println("✅ soccer_secret_key copied to assets/")
        } else {
            throw new GradleException("❌ soccer_secret_key not found in secrets/")
        }
    }
}

// Copy the Facebook client token from the secrets repository into assets
tasks.register("copyFacebookClientToken") {
    doLast {
        def source = file("../../secrets/facebook_client_token")
        def assetsDir = file("src/main/assets")
        def destination = new File(assetsDir, "facebook_client_token")

        if (source.exists()) {
            if (!assetsDir.exists()) {
                assetsDir.mkdirs()
            }
            Files.copy(source.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println("✅ facebook_client_token copied to assets/")
        } else {
            // Only warn, don't fail build - fall back to strings.xml
            println("⚠️ facebook_client_token not found in secrets/, will use strings.xml fallback")
        }
    }
}

// Generate Facebook key hashes for debug and release keystores
tasks.register("generateFacebookKeyHashes") {
    group = "facebook"
    description = "Generates Facebook key hashes for debug and release keystores"
    
    doLast {
        println("\n🔑 Facebook Key Hash Generator")
        println("=" * 50)
        
        // Generate hash for debug keystore
        def debugKeystorePath = System.getProperty("user.home") + "/.android/debug.keystore"
        def debugKeystore = new File(debugKeystorePath)
        
        if (debugKeystore.exists()) {
            try {
                def debugHash = generateKeyHash(debugKeystore, "android", "androiddebugkey")
                println("✅ DEBUG keystore hash: ${debugHash}")
                println("   Location: ${debugKeystorePath}")
            } catch (Exception e) {
                println("❌ Failed to generate debug keystore hash: ${e.getMessage()}")
            }
        } else {
            println("⚠️  Debug keystore not found at: ${debugKeystorePath}")
        }
        
        // Generate hash for release keystore
        def releaseSigningPropsFile = file("../../secrets/keystore.properties")
        if (releaseSigningPropsFile.exists()) {
            def releaseSigningProps = new Properties()
            releaseSigningProps.load(new FileInputStream(releaseSigningPropsFile))
            
            def keystorePath = releaseSigningProps['KEYSTORE_FILE']
            def keystorePassword = releaseSigningProps['KEYSTORE_PASSWORD']
            def keyAlias = releaseSigningProps['KEY_ALIAS']
            def keyPassword = releaseSigningProps['KEY_PASSWORD']
            
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                def releaseKeystore = file("../../${keystorePath}")
                if (releaseKeystore.exists()) {
                    try {
                        def releaseHash = generateKeyHash(releaseKeystore, keystorePassword, keyAlias)
                        println("✅ RELEASE keystore hash: ${releaseHash}")
                        println("   Location: ${releaseKeystore.absolutePath}")
                    } catch (Exception e) {
                        println("❌ Failed to generate release keystore hash: ${e.getMessage()}")
                    }
                } else {
                    println("❌ Release keystore not found at: ${releaseKeystore.absolutePath}")
                }
            } else {
                println("❌ Missing keystore configuration in keystore.properties")
            }
        } else {
            println("⚠️  Release keystore configuration not found at: ${releaseSigningPropsFile.absolutePath}")
            println("   Create keystore.properties in secrets/ directory for release keystore hash")
        }
        
        println("\n📋 Next Steps:")
        println("1. Copy the key hash(es) above")
        println("2. Go to Facebook App Dashboard: https://developers.facebook.com/apps/1232966491486195")
        println("3. Navigate to Settings → Basic")
        println("4. Add the key hash(es) to 'Key Hashes' field")
        println("5. Save changes")
        println("\n📖 For detailed instructions, see: docs/FACEBOOK_SETUP.md")
    }
}

// Helper method to generate key hash
ext.generateKeyHash = { keystoreFile, password, alias ->
    def keystore = KeyStore.getInstance("JKS")
    keystoreFile.withInputStream { stream ->
        keystore.load(stream, password.toCharArray())
    }
    
    Certificate cert = keystore.getCertificate(alias)
    MessageDigest md = MessageDigest.getInstance("SHA1")
    md.update(cert.getEncoded())
    return Base64.getEncoder().encodeToString(md.digest())
}



// Hook into the Firebase task *after* all plugins are applied
afterEvaluate {
    tasks.matching { it.name =~ /process.*GoogleServices/ }.configureEach {
        dependsOn("copyGoogleServicesJson")
    }
    tasks.matching { it.name == "preBuild" }.configureEach {
        dependsOn("copySoccerSecretKey", "copyFacebookClientToken")
    }
    // Generate Facebook key hashes during assembly to show which keystores are being used
    tasks.matching { it.name =~ /assemble.*/ }.configureEach {
        dependsOn("generateFacebookKeyHashes")
    }

}
